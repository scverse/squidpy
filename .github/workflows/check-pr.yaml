name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
    types:
      # title or body changes
      - edited
      # initial check
      - opened
      - reopened
      # code change (e.g. this workflow)
      - synchronize

permissions: {}

jobs:
  # Reads the PR title type and the “Release notes” checkbox to decide whether “check-relnotes” runs
  check-title:
    name: Check title and release notes checkbox
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # for amannn/action-semantic-pull-request
    steps:
      - name: Check if the “Release notes” checkbox is checked and filled
        uses: kaisugi/action-regex-match@d67cd689755dc47c5362609e0a6e2e1c93fa721b # v1.0.2
        id: checked-relnotes
        with:
          text: ${{ github.event.pull_request.body }}
          regex: '^\s*- \[x\].*Release notes.*not necessary because:(.*)$'
          flags: m
      - name: Check PR title
        id: check-title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      no-relnotes-reason: ${{ steps.checked-relnotes.outputs.group1 }}
      type: ${{ steps.check-title.outputs.type }}
  # Verifies that the changelog fragment for this PR and its title type has been added
  check-relnotes:
    name: Check for release notes
    runs-on: ubuntu-latest
    needs: check-title
    if: >-
      !contains(fromJSON('["pre-commit-ci[bot]","dependabot[bot]"]'), github.event.pull_request.user.login)
      && needs.check-title.outputs.no-relnotes-reason == ''
      && !contains(fromJSON('["style","refactor","test","build","docs","ci"]'), needs.check-title.outputs.type)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          { filter: "blob:none", fetch-depth: 0, persist-credentials: false }
      - name: Find out if a relevant release fragment is added
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: | # this is intentionally a string
            relnotes: 'docs/changelog/${{ github.event.pull_request.number }}.${{ (contains(github.event.pull_request.title, '!') && 'breaking') || needs.check-title.outputs.type }}.md'
      - name: Check if a relevant release fragment is added
        uses: flying-sheep/check@e10bb11109d1434ab16729bd988d78d65d47e163 # v1.0.5
        with:
          success: ${{ steps.changes.outputs.relnotes }}
